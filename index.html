<!DOCTYPE html>
<html lang="tr" data-hava="gunduz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cemre'nin Dünyası</title>
  <meta name="description" content="Cemre için küçük, tatlı bir dünya: Pıttıksu, tırnak salonu, pet evi, bahçe ve daha fazlası.">
  <meta name="theme-color" content="#F5C2BD">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cemre">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="css/giris.css">
  <link rel="stylesheet" href="css/mahalle.css">
  <link rel="stylesheet" href="css/posta.css">
  <link rel="stylesheet" href="css/pittiksu.css">
  <link rel="stylesheet" href="css/barbie.css">
  <link rel="stylesheet" href="css/tirnak.css">
  <link rel="stylesheet" href="css/petevi.css">
  <link rel="stylesheet" href="css/angela.css">
  <link rel="stylesheet" href="css/panda.css">
  <link rel="stylesheet" href="css/bahce.css">
  <link rel="stylesheet" href="css/ofke.css">
  <link rel="stylesheet" href="css/xox.css">
  <link rel="stylesheet" href="css/bizim.css">
  <link rel="stylesheet" href="css/safir.css">
</head>
<body class="battaniye-zemin" data-bolum="hub">
  <a class="atla" href="#mhTeraslar">Mahalleye atla</a>

  <!-- ================= MAHALLE (ana ekran · js/mahalle.js kurar; #hub kimliği yönlendirme için korunur) ================= -->
  <main id="hub" class="mahalle" aria-label="Bizim Mahalle"></main>

  <!-- ================= BÖLÜM KABUĞU (tek konteyner; modüller buraya mount olur) ================= -->
  <section id="bolum" class="bolum" hidden>
    <header class="ustbar">
      <button class="dugme-ikon" id="geriDugme" type="button" aria-label="Eve dön">‹</button>
      <h1><span id="bolumIkon" class="ustbar-ikon" aria-hidden="true" hidden></span><span id="bolumBaslik">Bölüm</span></h1>
      <span class="ustbar-kalp-yeri" aria-hidden="true"></span>
      <button class="dugme-ikon" id="bolumMenu" type="button" aria-label="Ses ve gece ayarları">⋯</button>
    </header>
    <div id="bolumIcerik" class="bolum-icerik"></div>
  </section>

  <!-- çekirdek katmanı: "seni düşünüyorum" kalbi (tek eleman, sabit) + Mahalle Postası kartları (js/posta.js) -->
  <button id="kalpDugme" type="button" aria-label="Seni düşünüyorum de" aria-haspopup="dialog" hidden></button>
  <div id="posta" role="status" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sheetKaplama" hidden>
    <div id="sheet" role="dialog" aria-modal="true" aria-label="Alt sayfa">
      <div class="tutamac" aria-hidden="true"></div>
      <div id="sheetIcerik"></div>
    </div>
  </div>
  <noscript><p class="yama" style="margin:16px">Bu dünya açılmak için JavaScript istiyor; tarayıcı ayarlarından açıp tekrar dener misin?</p></noscript>

  <!-- sıra: ayarlar → kilit (sihirli kelime + şifre çözme) → kilit.js sırayla yükler: çekirdek → senk → canlı → varlık → petler → giriş → bölümler → sorular → posta → mahalle -->
  <script src="config.js"></script>
  <script src="js/kilit.js"></script>
</body>
</html>
